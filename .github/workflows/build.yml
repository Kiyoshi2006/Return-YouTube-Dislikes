name: Build Return YouTube Dislikes dylib

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài công cụ
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Cài Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Cài header YouTubeHeader và PSHeader vào Theos
        run: |
          git clone --depth 1 https://github.com/PoomSmart/YouTubeHeader.git "$HOME/theos/include/YouTubeHeader"
          git clone --depth 1 https://github.com/PoomSmart/PSHeader.git "$HOME/theos/include/PSHeader"

      - name: Build
        run: make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Gom file ra
        run: |
          mkdir -p out
          f=$(find .theos/_ -name "*.dylib" | head -n 1)
          echo "== dylib: $f"
          cp -v "$f" out/
          if [ -d "layout/Library/Application Support" ]; then
            for b in "layout/Library/Application Support"/*.bundle; do
              [ -d "$b" ] && cp -R "$b" out/
            done
          fi
          ls -la out

      - name: Kiểm tra dylib (Mach-O + ldid)
        run: |
          for f in out/*.dylib; do
            echo "=== $f"
            file "$f"
            lipo -info "$f"
            otool -hv "$f" | tail -n 2
            cp "$f" /tmp/check.dylib
            ldid -S /tmp/check.dylib && echo "ldid -S OK"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: RYD-dylib
          path: out/
